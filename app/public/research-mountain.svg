<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mountain landscape</title>
  <desc id="desc">A code-authored illustration of layered mountains beneath a dawn sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="0.62" stop-color="#3f779d"/>
      <stop offset="1" stop-color="#f4c095"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e9eef2"/>
      <stop offset="0.45" stop-color="#8ba7b8"/>
      <stop offset="1" stop-color="#36566b"/>
    </linearGradient>
    <linearGradient id="foreground" x1="0" x2="0.9" y1="0" y2="1">
      <stop offset="0" stop-color="#203d4f"/>
      <stop offset="1" stop-color="#0c1d2a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1170" cy="330" r="98" fill="#ffd8a8" opacity="0.82" filter="url(#glow)"/>
  <circle cx="1170" cy="330" r="55" fill="#ffe8c5" opacity="0.95"/>

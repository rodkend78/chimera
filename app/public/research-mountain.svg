  <path d="m570 370 78 102 62-43 70 82-132-22-80 71-95 23Z" fill="#f7fbfd" opacity="0.9"/>
  <path d="m1010 270 122 173 80-75 115 151-172-73-117 87-124-3Z" fill="#f7fbfd" opacity="0.88"/>
  <path d="M0 790 260 650 470 790 730 560 960 770 1240 540 1600 745V1000H0Z" fill="#294c60" opacity="0.9"/>
  <path d="M0 850 310 720 555 865 835 690 1115 870 1400 705 1600 820V1000H0Z" fill="url(#foreground)"/>
  <path d="M0 928c210-48 376-42 560 4 221 55 417 30 615-12 155-33 288-32 425 4v76H0Z" fill="#07131e" opacity="0.72"/>
</svg>

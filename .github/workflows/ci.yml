name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux Harness sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu 24.04 restricts unprivileged user namespaces by default. The
      # upstream Bubblewrap project enables them the same way on its ephemeral
      # GitHub runner so the real namespace boundary can be exercised here.
      - name: Enable user namespaces on the ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install browser test runtimes
        run: npx playwright install --with-deps chromium firefox

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          curl --fail --location --silent --show-error "$GITLEAKS_URL" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          install_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 0555 "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan tracked source export
        run: |
          set -euo pipefail
          source_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$source_root"
          (
            cd "$source_root"
            gitleaks detect \
              --source . \
              --no-git \
              --no-banner \
              --redact \
              --config "$source_root/.gitleaks.toml" \
              --report-format json \
              --report-path "$RUNNER_TEMP/chimera-gitleaks.json"
          )

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
